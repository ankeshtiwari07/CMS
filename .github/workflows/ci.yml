name: CI
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (ai-service)
        run: pnpm --filter @humain/ai-service test
      - name: Build all apps
        env:
          DATABASE_URI: postgres://build:build@localhost:5432/build
          PAYLOAD_SECRET: build-time-secret-build-time-secret-1234
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          pnpm --filter @humain/cms build
          pnpm --filter @humain/web build
          pnpm --filter @humain/studio build
          pnpm --filter @humain/ai-service build
          pnpm --filter @humain/mcp-server build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t humain-cms-stack:ci .

# The Trivy filesystem scan that used to live here has moved to
# security-scan.yml, which runs the same scan blocking (exit-code 1) plus
# secret and IaC scanning. This job pinned trivy-action@0.24.0, a tag that no
# longer resolves, so it had been failing on every run rather than scanning.

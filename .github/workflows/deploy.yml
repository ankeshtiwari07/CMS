name: Deploy
on: { push: { tags: ["v*"] } }
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - name: Build & push images
        run: |
          for app in cms web studio ai-service mcp-server; do
            docker build -f infra/docker/Dockerfile.$app -t ghcr.io/humain/$app:${GITHUB_REF_NAME} .
            docker push ghcr.io/humain/$app:${GITHUB_REF_NAME}
          done
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
      - name: Helm upgrade (KSA cluster)
        run: helm upgrade --install humain infra/helm/humain --namespace humain --set image.tag=${GITHUB_REF_NAME} --wait --atomic

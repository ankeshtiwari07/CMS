# AI service (Fastify agentic core) + async workers (RAG index / scheduled publish / webhook outbox).
apiVersion: apps/v1
kind: Deployment
metadata: { name: ai-service, namespace: humain-cms, labels: { app: ai-service } }
spec:
  replicas: 2
  selector: { matchLabels: { app: ai-service } }
  template:
    metadata: { labels: { app: ai-service } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ai-service
          image: REGION-docker.pkg.dev/PROJECT/humain-cms/ai-service:__TAG__
          command: ["node", "dist/server.js"]
          ports: [{ containerPort: 4000 }]
          envFrom: [{ configMapRef: { name: cms-config } }, { secretRef: { name: cms-secrets } }]
          readinessProbe: { httpGet: { path: /health, port: 4000 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources: { requests: { cpu: "300m", memory: "512Mi" }, limits: { cpu: "1000m", memory: "1Gi" } }
---
apiVersion: v1
kind: Service
metadata: { name: ai-service, namespace: humain-cms }
spec:
  selector: { app: ai-service }
  ports: [{ port: 4000, targetPort: 4000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: workers, namespace: humain-cms, labels: { app: workers } }
spec:
  replicas: 2
  selector: { matchLabels: { app: workers } }
  template:
    metadata: { labels: { app: workers } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: workers
          image: REGION-docker.pkg.dev/PROJECT/humain-cms/ai-service:__TAG__
          command: ["node", "dist/worker.js"]   # RAG embed + scheduled-publish sweeper + webhook outbox
          envFrom: [{ configMapRef: { name: cms-config } }, { secretRef: { name: cms-secrets } }]
          resources: { requests: { cpu: "250m", memory: "512Mi" }, limits: { cpu: "1000m", memory: "1Gi" } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ai-service, namespace: humain-cms }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ai-service }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }

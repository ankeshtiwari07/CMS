# HUMAIN CMS production stack (dedicated, under /opt/haow-cms on the haow VM).
# Core profile (default): postgres, redis, cms, console, ai-service, nginx.
# `--profile full` adds: public web, workers, mcp, opensearch, minio.
#
#   docker compose -f docker-compose.prod.yml up -d --build         # core
#   docker compose -f docker-compose.prod.yml --profile full up -d   # everything

x-app: &app
  image: humain-cms-stack:latest
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env.production
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: humain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-humain}
      POSTGRES_DB: humain
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humain"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  cms:
    <<: *app
    command: ["pnpm", "--filter", "@humain/cms", "start"]
    expose: ["3001"]

  console:
    <<: *app
    command: ["pnpm", "--filter", "@humain/studio", "start"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      cms: { condition: service_started }
    expose: ["3002"]

  ai-service:
    <<: *app
    command: ["pnpm", "--filter", "@humain/ai-service", "start"]
    expose: ["4000"]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [console, cms]
    ports:
      - "${HUMAIN_HTTP_PORT:-8020}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # ---- full profile ----
  web:
    <<: *app
    command: ["pnpm", "--filter", "@humain/web", "start"]
    profiles: ["full"]
    expose: ["3000"]

  workers:
    <<: *app
    command: ["sh", "-lc", "pnpm --filter @humain/ai-service worker & pnpm --filter @humain/ai-service indexer & wait"]
    profiles: ["full"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  mcp:
    <<: *app
    command: ["pnpm", "--filter", "@humain/mcp-server", "start"]
    profiles: ["full"]

  opensearch:
    image: opensearchproject/opensearch:2.16.0
    profiles: ["full"]
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-Humain_2026!}
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - osdata:/usr/share/opensearch/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    profiles: ["full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    restart: unless-stopped

volumes:
  pgdata:
  osdata:
  miniodata:

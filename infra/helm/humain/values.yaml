image:
  registry: ghcr.io/humain
  tag: latest
region: ksa
replicaCount: { web: 3, studio: 2, cms: 2, aiService: 2, mcpServer: 2 }
autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 10, targetCPUUtilizationPercentage: 70 }
ingress: { enabled: true, className: nginx, waf: true }
postgres: { external: true, pgvector: true }
redis:    { external: true }
opensearch: { external: true }
otel: { endpoint: "http://otel-collector:4318" }

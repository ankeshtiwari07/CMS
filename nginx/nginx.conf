# HUMAIN console reverse proxy. The console (login + Studio + Content Management
# + search) is the product surface on the primary host. The native Payload v3
# admin (component management / "true CMS" backend) is served on a dedicated
# admin host so it never collides with the console's /api or /_next namespaces.
upstream humain_console { server console:3002; }
upstream humain_cms     { server cms:3001; }

# --- Payload admin host (admin-cms.<ip>.sslip.io) ---------------------------
# Everything on this host goes to the Payload (cms) container: /admin UI, the
# Payload REST/GraphQL at /api, media, and its own /_next assets. Access is
# gated to admin-role users by Payload (Users.access.admin) — nginx only routes.
server {
  listen 80;
  server_name admin-cms.34-14-150-134.sslip.io;
  client_max_body_size 50m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Payload's admin (React/Next) needs inline + eval + blob workers; it is a
  # login-gated back office, so a pragmatic CSP is acceptable here.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  location / {
    proxy_pass http://humain_cms;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket upgrade (Payload live preview / HMR-style channels).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }
}

server {
  # Default host: the console. Must stay default_server so the primary cms host
  # (and anything not the admin host) always lands here, regardless of block order.
  listen 80 default_server;
  server_name _;
  client_max_body_size 25m;

  # --- Security headers ---
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    proxy_pass http://humain_console;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}

# HUMAIN reverse proxy. The console (login + Studio + Content Management) is the
# product surface and the DEFAULT host. The native Payload v3 admin (component
# management / "true CMS" back office) is served on the SAME host under /admin,
# with its REST at /payload-api and its assets at /cms-assets, so it never
# collides with the console's /api or /_next namespaces. Admin access is gated to
# admin-role users by Payload (Users.access.admin); nginx only routes.
upstream humain_console { server console:3002; }
upstream humain_cms     { server cms:3001; }

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 50m;

  # --- Security headers (console) ---
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # --- Payload admin UI (same host, /admin) — admin-role gated by Payload ------
  location /admin {
    proxy_pass http://humain_cms;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    # Payload's admin (React/Next) needs inline + eval + blob workers. It is a
    # login-gated back office, so a pragmatic CSP is acceptable here. A location
    # add_header replaces inherited ones, so the full set is repeated.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
  }

  # Payload REST/GraphQL — the admin browser calls /payload-api; map it to the
  # container's native /api so internal server-to-server callers keep using /api.
  location /payload-api {
    rewrite ^/payload-api(/.*)?$ /api$1 break;
    proxy_pass http://humain_cms;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # Payload admin /_next assets (isolated via next.config assetPrefix=/cms-assets).
  location /cms-assets/ {
    rewrite ^/cms-assets/(.*)$ /$1 break;
    proxy_pass http://humain_cms;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  # --- Console (everything else) ---
  location / {
    proxy_pass http://humain_console;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
